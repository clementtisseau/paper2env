name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jax==0.12.0.1" "jaxlib==0.12.0.1" optax numpy omegaconf pytest inspect-ai
      # CPU only; Docker is not run here
      - run: python -m pytest -q tests papers
